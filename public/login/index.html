<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Triodian</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/triodian-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<style>
  /* The sign-in page. Same file in the AI Risk Appetite and AI Use Assessment repos. */
  body{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box}
  .si{width:100%;max-width:420px;background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--aubergine);border-radius:14px;padding:30px 30px 24px;box-shadow:0 18px 40px rgba(23,32,43,.08)}
  .si-top{display:flex;align-items:center;gap:10px;margin-bottom:22px}
  .si-top img{height:26px;width:auto;display:block}
  .si-top .vrule{width:1px;height:20px;background:var(--rule)}
  .si-app{font-weight:600}
  .si h1{font:600 26px/1.2 var(--serif,'Source Serif 4',Georgia,serif);margin:0 0 6px}
  .si .lead{color:var(--ink-soft);margin:0 0 20px;font-size:14px}
  .si form{display:flex;flex-direction:column;gap:14px}
  .si input{font:400 15px/1.3 var(--sans);padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:#fff;color:var(--ink);width:100%;box-sizing:border-box}
  .si input:focus{outline:2px solid var(--aubergine);outline-offset:1px;border-color:var(--aubergine)}
  .pw{position:relative}
  .pw input{padding-right:64px}
  .pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--ink-soft);font:600 12px/1 var(--sans);padding:8px;cursor:pointer;border-radius:6px}
  .pw button:hover{background:var(--parchment-2);color:var(--ink)}
  .si .btn{width:100%;min-height:42px;border-radius:8px;font-size:15px}
  .msg{border-radius:8px;padding:10px 12px;font-size:14px;margin:0 0 16px}
  .msg.bad{background:var(--red-bg);color:var(--red)}
  .msg.ok{background:var(--green-bg);color:var(--green)}
  .or{display:flex;align-items:center;gap:10px;color:var(--ink-faint);font-size:12px;margin:20px 0 14px}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--rule)}
  .hint{font-size:12px;color:var(--ink-faint);margin:16px 0 0;text-align:center}
</style>
</head>
<body>
<main class="si">
  <div class="si-top"><img src="/triodian-logo.svg" alt="Triodian"><span class="vrule" aria-hidden="true"></span><span class="si-app" id="app-name">AI governance apps</span></div>
  <h1>Sign in</h1>
  <p class="lead">One sign-in opens AI Risk Appetite and AI Use Assessment.</p>
  <p class="msg bad" id="m-failed" role="alert" hidden>That username and password don’t match. Check them and try again.</p>
  <p class="msg bad" id="m-email" role="alert" hidden>Email sign-in didn’t complete. Try again.</p>
  <p class="msg ok" id="m-out" role="status" hidden>You’re signed out.</p>
  <form method="post" action="/auth/login" accept-charset="UTF-8">
    <input type="hidden" name="next" id="next" value="/">
    <label class="f" for="username">Username
      <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label class="f" for="password">Password
      <span class="pw"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" id="show" aria-controls="password" aria-pressed="false">Show</button></span></label>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
  <div class="or">or</div>
  <a class="btn" id="email-link" href="/auth/email">Sign in with your email</a>
  <p class="hint">Client and counsel accounts sign in with email.</p>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var next = q.get('next') || '/';
  if (next.charAt(0) !== '/' || next.indexOf('//') === 0) next = '/';
  document.getElementById('next').value = next;
  document.getElementById('email-link').href = '/auth/email?next=' + encodeURIComponent(next);
  if (q.has('failed')) document.getElementById('m-failed').hidden = false;
  if (q.get('email') === '0') document.getElementById('m-email').hidden = false;
  if (q.has('out')) document.getElementById('m-out').hidden = false;
  var h = location.hostname;
  var name = /risk-appetite/.test(h) ? 'AI Risk Appetite' : /use-assessment/.test(h) ? 'AI Use Assessment' : 'AI governance apps';
  document.getElementById('app-name').textContent = name + (/-test\./.test(h) ? ' · test site' : '');
  var pw = document.getElementById('password'), b = document.getElementById('show');
  b.addEventListener('click', function () { var s = pw.type === 'password'; pw.type = s ? 'text' : 'password'; b.textContent = s ? 'Hide' : 'Show'; b.setAttribute('aria-pressed', String(s)); });
  document.getElementById(q.has('failed') ? 'password' : 'username').focus();
})();
</script>
</body>
</html>

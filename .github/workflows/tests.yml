# Runs on every push and pull request. A failure shows on the commit in GitHub before anyone relies on it.
# Cloudflare deploys separately; this does not block a deploy, it tells you something broke.
name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:

# The workflow only reads the code: the token GitHub gives it cannot push, merge or change settings.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Server rules and logic
        run: for f in tests/*.test.mjs; do echo "== $f"; node "$f" || exit 1; done

      - name: Install browser test tools
        working-directory: tests/e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Browser and API tests (the Worker runs locally with a local database)
        working-directory: tests/e2e
        run: rm -rf .state && npx playwright test

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/test-results
          retention-days: 14
